<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>{% block title %}{{ page_title ~ ' — ' if page_title }}Nadeem Ahmed Ghoto{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Portfolio of Nadeem Ahmed Ghoto — AI/ML Student and Aspiring Engineer.{% endblock %}">
    <meta name="author" content="Nadeem Ahmed Ghoto">

    <!-- Open Graph -->
    <meta property="og:title" content="{% block og_title %}Nadeem Ahmed Ghoto — Portfolio{% endblock %}">
    <meta property="og:description" content="{% block og_description %}AI/ML Student | Aspiring ML Engineer | Building projects from scratch.{% endblock %}">
    <meta property="og:type" content="website">

    <!-- Fonts (per design system) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Anti-FOUC (Flash of Unstyled Content) Script -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    {% block head_extra %}{% endblock %}
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    {% include 'partials/_navbar.html' %}

    <main id="main-content" class="main">
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/_footer.html' %}

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
